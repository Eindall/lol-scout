services:
  lol-scout:
    build: .
    container_name: lol-scout
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://scout:${POSTGRES_PASSWORD}@lol-scout-db:5432/scout
    depends_on:
      db:
        condition: service_healthy
    networks: [default, proxy]

  db:
    image: postgres:16-alpine
    container_name: lol-scout-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: scout
    volumes:
      - ${DB_DATA_DIR:?DB_DATA_DIR manquant dans .env}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      timeout: 3s
      retries: 10
  
networks:
  proxy:
    external: true
